<!DOCTYPE html>
<html>

<head>

<style>

body{

   font-family:Arial;
   background:#dbeafe;
   text-align:center;
   padding:30px;

}

main{

   background:white;
   width:350px;
   margin:auto;
   padding:20px;
   border-radius:10px;

}

button{

   width:40%;
   padding:10px;
   margin:5px;
   border:none;
   color:white;

}

</style>

</head>

<body>

<main>

<h1>Controle de Leitos</h1>

<button
style="background:green"
onclick="ocuparLeito()">

Ocupar

</button>

<button
style="background:red"
onclick="liberarLeito()">

Liberar

</button>

<h2 id="resultado">

0 Leitos Ocupados

</h2>

</main>

<script>

let leitos = 0;

function ocuparLeito(){

   leitos = leitos + 1;

   document.getElementById("resultado").innerHTML =

   leitos + " Leitos Ocupados";

}

function liberarLeito(){

   if(leitos > 0){

      leitos = leitos - 1;

   }

   document.getElementById("resultado").innerHTML =

   leitos + " Leitos Ocupados";

}

5. Inserir nome do paciente

6. Criar botão zerar

*/

</script>

</body>
</html>
